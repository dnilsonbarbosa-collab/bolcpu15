<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=relatorio.html">
    <title>Relatório de Serviço - 15º BPM</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0a0a0a">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .loader {
            text-align: center;
            color: white;
        }
        .loader img {
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
            animation: pulse 1.5s ease-in-out infinite;
        }
        .loader h1 {
            font-size: 1.2rem;
            font-weight: 700;
            margin: 0;
        }
        .loader p {
            font-size: 0.85rem;
            color: #a3a3a3;
            margin-top: 8px;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.7; transform: scale(0.95); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <img src="relatorio-15bpm-icon-transparent.png" alt="15º BPM" onerror="this.style.display='none'">
        <h1>Carregando...</h1>
        <p>Relatório de Serviço - 15º BPM</p>
    </div>
    <script>
        // Redirecionar imediatamente
        window.location.replace('relatorio.html');
    </script>
</body>
</html>
